# Shared air config; docker/dev-go.sh sets the per-service build.
root = "."
tmp_dir = "/tmp/air"

[build]
include_ext = ["go", "sql"]
exclude_dir = ["node_modules", ".git", "apps", "tmp"]
exclude_regex = ["_test\\.go$"]
delay = 200
stop_on_error = true

[log]
time = false

[misc]
clean_on_exit = true
