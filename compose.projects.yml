# Generated by `just gen` from project.yaml files. Do not edit.
#
# One container per project; `just up <name>` starts it with everything it
# depends on. Included by compose.yml.
services:
  auth:
    image: laurel-go-dev
    build: { context: ., dockerfile: docker/go-dev.Dockerfile }
    command: [dev-go, auth]
    env_file:
      - dev.env
      - { path: services/auth/.env, required: false }
    environment:
      AUTO_MIGRATE: "true"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/auth?sslmode=disable
    volumes:
      - .:/src
      - go_mod:/go/pkg/mod
      - go_build:/root/.cache/go-build
    depends_on:
      auth-db: { condition: service_completed_successfully }
    restart: unless-stopped
  auth-db:
    extends: { file: compose.db.yml, service: create-database }
    environment: { DB_NAME: auth }
    depends_on: { postgres: { condition: service_healthy } }

  gateway:
    image: laurel-go-dev
    build: { context: ., dockerfile: docker/go-dev.Dockerfile }
    command: [dev-go, gateway]
    env_file:
      - dev.env
      - { path: services/gateway/.env, required: false }
    environment:
      ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      - .:/src
      - go_mod:/go/pkg/mod
      - go_build:/root/.cache/go-build
    depends_on:
      auth: { condition: service_started }
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: docker/svelte-dev.Dockerfile, args: { APP: web } }
    image: laurel-web-dev
    ports:
      - "5173:5173"
    env_file:
      - { path: apps/web/.env, required: false }
    environment:
      NODE_ENV: development
      PORT: "5173"
      API_URL: http://localhost:8080
    volumes:
      - .:/repo
      - /repo/node_modules
      - /repo/apps/web/node_modules
      - /repo/libraries/ts/rpc/node_modules
      - /repo/libraries/ts/ui/node_modules
      - /repo/rpc/generated/typescript/node_modules
      - /repo/rpc/generators/typescript/node_modules
    depends_on: [gateway]
    restart: unless-stopped

volumes:
  # Shared by every Go service.
  go_mod: { name: laurel-go-mod }
  go_build: { name: laurel-go-build }
