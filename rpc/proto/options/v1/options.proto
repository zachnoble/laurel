syntax = "proto3";

package options.v1;

import "google/protobuf/descriptor.proto";

extend google.protobuf.MethodOptions {
  // The procedure may be called without a signed-in user. The identity, if
  // any, is still available via rpc.IdentityFrom.
  bool public = 50000;
}

extend google.protobuf.ServiceOptions {
  // The service is callable only by other services, never through the
  // gateway (rpc.Authenticator rejects requests carrying rpc.ViaGatewayHeader).
  bool internal = 50001;
}
